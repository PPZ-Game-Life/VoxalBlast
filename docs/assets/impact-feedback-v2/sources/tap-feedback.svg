<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128">
  <!-- Four 128x128 frames, fixed center pivot. Frame 1 is reduced-motion static art. -->
  <g id="frame-0">
    <circle cx="64" cy="64" r="11" fill="#FFF1CC" stroke="#20334C" stroke-width="5"/>
    <circle cx="60" cy="60" r="3" fill="#FFFFFF" opacity=".9"/>
  </g>
  <g id="frame-1" transform="translate(128 0)">
    <circle cx="64" cy="64" r="10" fill="#FFF1CC" stroke="#20334C" stroke-width="4"/>
    <circle cx="64" cy="64" r="22" fill="none" stroke="#E2A62B" stroke-width="5"/>
  </g>
  <g id="frame-2" transform="translate(256 0)">
    <circle cx="64" cy="64" r="7" fill="#FFF1CC" stroke="#20334C" stroke-width="3"/>
    <circle cx="64" cy="64" r="35" fill="none" stroke="#FFF1CC" stroke-width="7"/>
    <circle cx="64" cy="64" r="35" fill="none" stroke="#20334C" stroke-width="2" opacity=".8"/>
  </g>
  <g id="frame-3" transform="translate(384 0)" opacity=".5">
    <circle cx="64" cy="64" r="47" fill="none" stroke="#FFF1CC" stroke-width="5"/>
    <circle cx="64" cy="64" r="47" fill="none" stroke="#20334C" stroke-width="1.5"/>
    <circle cx="64" cy="64" r="4" fill="#FFF1CC"/>
  </g>
</svg>
