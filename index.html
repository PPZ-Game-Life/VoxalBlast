<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#69a5ff" />
    <title>VoxalBlast</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span id="app-version" class="app-version" aria-label="Game version"></span>
        <div class="score-chip" aria-label="Score">
          <span class="score-chip-label">SCORE</span>
          <span id="score" class="score-chip-value">0000</span>
        </div>
        <!-- CHAIN (v0.3, 08 §7.5): the stake of the streak. Hidden below a chain of
             HUD_STYLE.chainMinVisible so that breaking it costs something. -->
        <div id="chain" class="chain-chip" aria-hidden="true" aria-label="Clear streak">
          <span class="chain-chip-label">CHAIN</span>
          <span class="chain-chip-value">×<b id="chain-value">0</b></span>
          <span class="chain-chip-bar" aria-hidden="true"><i id="chain-bar"></i></span>
        </div>
        <!-- BEST is allowed again since 2026-09-11 (04「UI 与发布」修订): it must
             stay visually below SCORE and the row must never wrap. -->
        <div class="best-chip" aria-label="Best score">
          <span class="best-chip-label">BEST</span>
          <span id="best" class="best-chip-value">0</span>
        </div>
        <!-- PC keyboard legend (v0.4.1, 03 §13). Rendered from 641px up only: below
             that the pointer is a thumb, and the swipe model already covers those
             axes. The bindings themselves work at any width. -->
        <button id="controls-button" class="icon-button" type="button" aria-label="Open controls" title="Controls"><span aria-hidden="true">⌨</span></button>
        <button id="settings-button" class="icon-button" type="button" aria-label="Open settings" title="Settings"><span aria-hidden="true">⚙</span></button>
      </header>
      <main class="game-layout">
        <section class="board-section">
          <div class="status-line"><span class="status-dot"></span><span id="status">Pick a shape</span></div>
          <div id="scene-wrap" class="scene-wrap"></div>
          <!-- Honor broadcast layer (08 §6): lives in the info band above the cube,
               never covers the board, never takes a pointer event. -->
          <div id="honor-layer" class="honor-layer" aria-live="polite"></div>
          <div id="axis-pick" class="axis-pick hidden" aria-label="Rocket line">
            <button type="button" data-axis="row">Row</button>
            <button type="button" data-axis="col">Col</button>
          </div>
          <!-- Transient "which axis just turned" badge for the keyboard (03 §13.3):
               a keycap plus the same axis ring the controls card draws, so a PC
               player learns W/S vs Q/E without reading a list. Fades on its own and
               never takes a pointer event. -->
          <div id="axis-hint" class="axis-hint" aria-hidden="true">
            <kbd id="axis-hint-key">W</kbd>
            <span id="axis-hint-ring" class="axis-hint-ring"><i></i></span>
            <span id="axis-hint-axis" class="axis-hint-axis">X</span>
          </div>
          <div id="toast" class="toast" aria-live="polite"></div>
        </section>
        <section class="bottom-panel">
          <div id="piece-slots" class="piece-slots"></div>
          <div id="item-bar" class="item-bar" aria-label="Items">
            <button class="item-button" type="button" data-item="refresh" title="Reroll the three pieces" aria-label="Reroll pieces"><span class="item-icon" aria-hidden="true">↻</span><span class="item-count">0</span></button>
            <button class="item-button" type="button" data-item="hammer" title="Remove one block from a face" aria-label="Hammer one block"><span class="item-icon" aria-hidden="true">🔨</span><span class="item-count">0</span></button>
            <button class="item-button" type="button" data-item="rocket" title="Clear a full row or column on the face" aria-label="Rocket clears a line"><span class="item-icon" aria-hidden="true">🚀</span><span class="item-count">0</span></button>
            <button class="item-button" type="button" data-item="bomb" title="Blast a 2x2 area on the face" aria-label="Bomb blasts an area"><span class="item-icon" aria-hidden="true">💣</span><span class="item-count">0</span></button>
          </div>
          <div id="cancel-zone" class="cancel-zone" aria-hidden="true">
            <span class="cancel-icon" aria-hidden="true">×</span>
            <span class="cancel-copy"><strong>Cancel</strong><small>placement</small></span>
            <span class="cancel-arrow" aria-hidden="true">↩</span>
          </div>
        </section>
      </main>
      <!-- Home screen (v0.4, 03 §「主页与断点续玩」): the game opens here instead of on
           a live board. An OPAQUE COVER, not a hidden game layer — the 3D canvas keeps
           its size behind it, so coming home and going back costs no reload and no
           re-fit. The primary button reads 继续游戏 whenever a resume snapshot exists
           (src/game/session.js), 新游戏 otherwise. -->
      <div id="home" class="home-screen" role="dialog" aria-modal="true" aria-labelledby="home-title">
        <div class="home-inner">
          <div class="home-brand">
            <span class="home-mark" aria-hidden="true">V</span>
            <h1 id="home-title">VoxalBlast</h1>
            <p class="home-tagline">立体消除 · 六面连爆</p>
          </div>
          <div class="home-record">
            <span class="home-record-label">最高分</span>
            <strong id="home-best">0</strong>
          </div>
          <button id="home-primary" class="home-primary" type="button">
            <span class="home-primary-icon" aria-hidden="true">▶</span>
            <span id="home-primary-label">新游戏</span>
          </button>
          <p id="home-resume-note" class="home-resume-note" aria-live="polite"></p>
          <div class="home-secondary-row">
            <button id="home-leaderboard" class="home-secondary" type="button"><span aria-hidden="true">🏆</span>排行榜</button>
            <button id="home-settings" class="home-secondary" type="button"><span aria-hidden="true">⚙</span>设置</button>
          </div>
        </div>
      </div>
      <!-- Controls card (v0.4.1, 03 §13): the PC keyboard legend, drawn rather than
           written. Each row is a keycap pair, a mini cube with the ring of the world
           axis that key turns, and a two-word caption. The mini cube is a real CSS
           3D cube and it TURNS when the matching key is pressed, so the card teaches
           the mapping by doing it. Markup stays static (hand-tuned art); the headless
           check compares the printed keycaps against KEY_BINDINGS in
           src/rendering/keyboard.js, so the legend can never advertise a dead key. -->
      <div id="controls-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="controls-title">
        <div class="modal-content controls-card">
          <div class="settings-header">
            <div><div class="eyebrow">PC KEYBOARD</div><h1 id="controls-title">操作说明</h1></div>
            <button id="controls-close" class="modal-close" type="button" aria-label="Close controls">×</button>
          </div>
          <div class="controls-list">
            <div class="ctrl-row" data-axis="pitch">
              <div class="ctrl-keys"><kbd data-key="w">W</kbd><kbd data-key="s">S</kbd></div>
              <div class="ctrl-diagram" aria-hidden="true">
                <span class="ctrl-cube"><i class="ctrl-face ctrl-back"></i><i class="ctrl-face ctrl-left"></i><i class="ctrl-face ctrl-right"></i><i class="ctrl-face ctrl-top"></i></span>
                <span class="ctrl-ring"><i></i></span>
              </div>
              <div class="ctrl-copy"><strong>上下翻面</strong><small>绕 X 轴（屏幕横轴）</small></div>
            </div>
            <div class="ctrl-row" data-axis="yaw">
              <div class="ctrl-keys"><kbd data-key="a">A</kbd><kbd data-key="d">D</kbd></div>
              <div class="ctrl-diagram" aria-hidden="true">
                <span class="ctrl-cube"><i class="ctrl-face ctrl-back"></i><i class="ctrl-face ctrl-left"></i><i class="ctrl-face ctrl-right"></i><i class="ctrl-face ctrl-top"></i></span>
                <span class="ctrl-ring"><i></i></span>
              </div>
              <div class="ctrl-copy"><strong>左右翻转</strong><small>绕 Y 轴（屏幕纵轴）</small></div>
            </div>
            <div class="ctrl-row" data-axis="roll">
              <div class="ctrl-keys"><kbd data-key="q">Q</kbd><kbd data-key="e">E</kbd></div>
              <div class="ctrl-diagram" aria-hidden="true">
                <span class="ctrl-cube"><i class="ctrl-face ctrl-back"></i><i class="ctrl-face ctrl-left"></i><i class="ctrl-face ctrl-right"></i><i class="ctrl-face ctrl-top"></i></span>
                <span class="ctrl-ring"><i></i></span>
              </div>
              <div class="ctrl-copy"><strong>平面自转</strong><small>绕 Z 轴（屏幕法线）</small></div>
            </div>
          </div>
          <p class="controls-note">每个键 = 一次翻面，与鼠标拖拽 / 单指滑动完全同轴同向；按住不连发。</p>
        </div>
      </div>
      <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content settings-card">
          <div class="settings-header">
            <div><div class="eyebrow">GAME OPTIONS</div><h1 id="settings-title">SETTINGS</h1></div>
            <button id="settings-close" class="modal-close" type="button" aria-label="Close settings">×</button>
          </div>
          <div class="settings-list">
            <button id="sound-setting" class="setting-row" type="button"><span><strong>SOUND</strong><small>Game audio</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <button id="haptics-setting" class="setting-row" type="button"><span><strong>HAPTICS</strong><small>Touch vibration</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <button id="controls-setting" class="setting-row" type="button"><span><strong>操作说明</strong><small>PC keyboard shortcuts</small></span><span class="setting-hint" aria-hidden="true">W A S D Q E</span></button>
            <!-- v0.4: the way home from anywhere, including the Game Over panel. The
                 run in progress is snapshotted first, so this never costs progress. -->
            <button id="home-setting" class="setting-action" type="button"><span aria-hidden="true">⌂</span><strong>回到主页</strong></button>
            <button id="restart-setting" class="setting-action danger" type="button"><span>↻</span><strong>RESTART GAME</strong></button>
          </div>
        </div>
      </div>
      <!-- Game Over (08 §7.5): the "再来一局" screen. Delta copy first, then the next
           goal (六面制霸), then what was earned this run. -->
      <div id="game-over" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
        <div class="modal-content game-over-card">
          <div class="eyebrow">RUN COMPLETE</div>
          <h1 id="game-over-title">GAME OVER</h1>
          <div class="final-score"><span id="final-score">0000</span><small>POINTS</small></div>
          <p id="game-over-best" class="game-over-best"></p>
          <div id="game-over-faces" class="game-over-faces"></div>
          <div id="game-over-honors" class="game-over-honors"></div>
          <div id="game-over-stats" class="game-over-stats"></div>
          <div class="game-over-actions">
            <button id="reset-modal" class="restart-button" type="button"><span>↻</span> PLAY AGAIN</button>
            <button id="leaderboard-button" class="ghost-button" type="button">排行榜</button>
          </div>
        </div>
      </div>
      <!-- Local leaderboard panel (08 §7.5): Layer 1 only, plus the platform entry.
           Rows are rendered in main.js from src/game/records.js. -->
      <div id="leaderboard" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
        <div class="modal-content leaderboard-card">
          <div class="settings-header">
            <div><div class="eyebrow">LOCAL RECORDS</div><h1 id="leaderboard-title">排行榜</h1></div>
            <button id="leaderboard-close" class="modal-close" type="button" aria-label="Close leaderboard">×</button>
          </div>
          <div id="leaderboard-body" class="leaderboard-body"></div>
          <div id="leaderboard-platform" class="leaderboard-platform"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
