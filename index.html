<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#69a5ff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='6' fill='%23e2af78'/%3E%3Cpath d='M4 16h24M16 4v24' stroke='%23765033' stroke-width='2'/%3E%3C/svg%3E" />
    <title>VoxalBlast</title>
  </head>
  <body>
    <div id="app" class="home-open">
      <header class="topbar">
        <div class="score-plaque" aria-hidden="true"></div>
        <button id="sound-button" class="icon-button" type="button" aria-label="Sound" aria-pressed="true" title="Sound"></button>
        <span id="app-version" class="app-version" aria-label="Game version"></span>
        <div class="score-chip" aria-label="Score">
          <span class="score-chip-label">SCORE</span>
          <span id="score" class="score-chip-value">0000</span>
        </div>
        <!-- CHAIN (v0.3, 08 §7.5): the stake of the streak. Hidden below a chain of
             HUD_STYLE.chainMinVisible so that breaking it costs something. -->
        <div id="chain" class="chain-chip" aria-hidden="true" aria-label="Clear streak">
          <span class="chain-chip-label">CHAIN</span>
          <span class="chain-chip-value">×<b id="chain-value">0</b></span>
          <span class="chain-chip-bar" aria-hidden="true"><i id="chain-bar"></i></span>
        </div>
        <!-- BEST is allowed again since 2026-09-11 (04「UI 与发布」修订): it must
             stay visually below SCORE and the row must never wrap. -->
        <div class="best-chip" aria-label="Best score">
          <span class="best-chip-label">BEST</span>
          <span id="best" class="best-chip-value">0</span>
        </div>
        <!-- PC keyboard legend (v0.4.1, 03 §13). Rendered from 641px up only: below
             that the pointer is a thumb, and the swipe model already covers those
             axes. The bindings themselves work at any width. -->
        <button id="controls-button" class="icon-button" type="button" aria-label="Open controls" title="Controls"><span aria-hidden="true"></span></button>
        <button id="settings-button" class="icon-button" type="button" aria-label="Open settings" title="Settings"><span aria-hidden="true"></span></button>
      </header>
      <main class="game-layout">
        <!-- v0.9.8 touch map. The view is a fixed 100dvh stage, so no game surface may pan the
             window; these two inert layers make that explicit instead of accidental. They are
             deliberately the FIRST two children of .game-layout: the board, the candidate tray
             and the item bar are later siblings, so they paint and hit-test ABOVE both layers
             and never lose a drag to them.
               .scroll-shield  owns the whole viewport with `touch-action: none` — anywhere that
                               is not a game surface (the sky above the cube, the meadows beside
                               it, the gaps in the tray and the item strip) consumes the gesture
                               instead of scrolling the page.
               .scroll-strip   re-opens `pan-y` in the top HUD band only: if the view ever does
                               overflow, the top is the single place a slide may still scroll it. -->
        <div class="scroll-shield" aria-hidden="true"></div>
        <div class="scroll-strip" aria-hidden="true"></div>
        <section class="board-section">
          <img class="garden-pedestal" src="./art/reference/pedestal.webp" alt="" aria-hidden="true" draggable="false" />
          <div class="status-line"><span class="status-dot"></span><span id="status">Pick a shape</span></div>
          <div id="scene-wrap" class="scene-wrap"></div>
          <!-- Honor broadcast layer (08 §6): lives in the info band above the cube,
               never covers the board, never takes a pointer event. -->
          <div id="honor-layer" class="honor-layer" aria-live="polite"></div>
          <!-- Transient "which axis just turned" badge for the keyboard (03 §13.3):
               a keycap plus the same axis ring the controls card draws, so a PC
               player learns W/S vs Q/E without reading a list. Fades on its own and
               never takes a pointer event. -->
          <div id="axis-hint" class="axis-hint" aria-hidden="true">
            <kbd id="axis-hint-key">W</kbd>
            <span id="axis-hint-ring" class="axis-hint-ring"><i></i></span>
            <span id="axis-hint-axis" class="axis-hint-axis">X</span>
          </div>
          <div id="toast" class="toast" aria-live="polite"></div>
        </section>
        <section class="bottom-panel">
          <div id="piece-slots" class="piece-slots"></div>
          <div id="cancel-zone" class="cancel-zone" aria-hidden="true">
            <span class="cancel-icon" aria-hidden="true">×</span>
            <span class="cancel-copy"><strong id="cancel-zone-title">Cancel</strong><small id="cancel-zone-note">placement</small></span>
            <span class="cancel-arrow" aria-hidden="true">↩</span>
          </div>
          <!-- Refresh's inline confirmation (07 §8.8). It lives INSIDE the tray on purpose: a
               refresh acts on the candidates, not on the board, so "replace this whole batch?"
               is asked where the batch is. It is absolutely positioned over the slots so nothing
               moves when it opens — 「不提前 reroll」 needs the slots to stay exactly where the
               player was already looking. -->
          <div id="refresh-confirm" class="refresh-confirm hidden" role="group" aria-label="换批确认">
            <span id="refresh-confirm-copy" class="refresh-confirm-copy"></span>
            <button id="refresh-keep" class="refresh-keep" type="button">保留当前</button>
            <button id="refresh-go" class="refresh-go" type="button">换一批 · −1</button>
          </div>
        </section>
        <!-- The item strip is a SIBLING of the board, not a child of the candidate panel
             (v0.4.3). On a phone the three blocks have to be able to sit in the order
             items → cube → candidates for one-handed play, and CSS `order` can only
             arrange siblings. Desktop keeps the Block Blast reading (cube, candidates,
             items) with the same DOM.

             v1 (07 §8.3): every icon now carries its NAME as well as its count — four pictograms
             and a number is not something a new player can read. The name lives INSIDE the
             button, so the strip grows by `--item-caption` and the board band is offset by the
             same amount (see reference.css) instead of the caption eating into the cube. -->
        <div id="item-bar" class="item-bar" aria-label="Items">
          <button class="item-button" type="button" data-item="refresh" title="丢弃当前整批候选并重抽三块" aria-label="换批"><span class="item-icon" aria-hidden="true">↻</span><span class="item-count">0</span><span class="item-name">换批</span><span class="item-empty">本局已用完</span></button>
          <button class="item-button" type="button" data-item="hammer" title="敲掉正面的一格方块" aria-label="锤子"><span class="item-icon" aria-hidden="true">🔨</span><span class="item-count">0</span><span class="item-name">锤子</span><span class="item-empty">本局已用完</span></button>
          <button class="item-button" type="button" data-item="rocket" title="清掉正面的一整行或一整列" aria-label="火箭"><span class="item-icon" aria-hidden="true">🚀</span><span class="item-count">0</span><span class="item-name">火箭</span><span class="item-empty">本局已用完</span></button>
          <button class="item-button" type="button" data-item="bomb" title="炸掉正面的 2×2 区域" aria-label="炸弹"><span class="item-icon" aria-hidden="true">💣</span><span class="item-count">0</span><span class="item-name">炸弹</span><span class="item-empty">本局已用完</span></button>
          <!-- The strip IS the second cancel zone while a tool is dragged out of an icon
               (07 §8.3): it and the candidate tray are TWO independent rectangles, never one
               big box that swallows the board between them. `pointer-events:none` — the hit
               test is a rect test in the input layer, the same one the tray uses, so returning
               the finger here is judged by exactly the same rule. -->
          <div id="item-cancel-zone" class="cancel-zone item-cancel-zone" aria-hidden="true">
            <span class="cancel-icon" aria-hidden="true">×</span>
            <span class="cancel-copy"><strong>拖到这里取消</strong><small>松手取消</small></span>
          </div>
        </div>
        <!-- The item status bar (07 §8.3): [图标 名称] [操作提示/目标数量] [× 取消], with the
             rocket's ↔/↕ switch and the tap path's 使用 · −1 appended when they apply. It is a
             SIBLING of the strip rather than the strip itself: the four icons stay the picker
             (and the cancel target), while this bar is the single place that says what the armed
             tool is about to do. Fixed under the strip — it never follows the finger.

             The undo window's bar (07 §8.9) shares this column: 取消 ≠ 撤销, and a clear's 撤销
             must be a real button with a 44px target that an ordinary toast can never paint over. -->
        <div id="action-bars" class="action-bars">
          <div id="item-status" class="item-status hidden" role="status" aria-live="polite">
            <span class="item-status-tool">
              <span id="item-status-icon" class="item-status-icon" aria-hidden="true"></span>
              <span id="item-status-name" class="item-status-name"></span>
            </span>
            <span id="item-status-hint" class="item-status-hint"></span>
            <span id="axis-pick" class="axis-pick hidden" aria-label="火箭方向">
              <button type="button" data-axis="row">↔ 横向</button>
              <button type="button" data-axis="col">↕ 纵向</button>
            </span>
            <button id="item-use" class="item-use hidden" type="button">使用 · −1</button>
            <button id="item-cancel" class="item-cancel" type="button" aria-label="取消当前道具">✕ 取消</button>
          </div>
          <div id="undo-bar" class="undo-bar hidden" role="status" aria-live="polite">
            <span id="undo-bar-text" class="undo-bar-text"></span>
            <button id="undo-button" class="undo-button" type="button">撤销</button>
          </div>
        </div>
      </main>
      <!-- Home screen (v0.4, 03 §「主页与断点续玩」): the game opens here instead of on
           a live board. The game layer is invisible and inert, but keeps its layout
           size behind the cover, so coming home and going back costs no reload and no
           re-fit. The primary button reads 继续游戏 whenever a resume snapshot exists
           (src/game/session.js), 新游戏 otherwise. -->
      <div id="home" class="home-screen" role="dialog" aria-modal="true" aria-labelledby="home-title">
        <div class="home-inner">
          <div class="home-brand">
            <div id="home-hero" class="home-hero" aria-hidden="true"></div>
            <h1 id="home-title">VoxalBlast</h1>
            <p class="home-tagline">立体消除 · 六面连爆</p>
          </div>
          <div class="home-record">
            <span class="home-record-label">最高分</span>
            <strong id="home-best">0</strong>
          </div>
          <button id="home-primary" class="home-primary" type="button">
            <span class="home-primary-icon" aria-hidden="true">▶</span>
            <span id="home-primary-label">新游戏</span>
          </button>
          <p id="home-resume-note" class="home-resume-note" aria-live="polite"></p>
          <div class="home-secondary-row">
            <button id="home-leaderboard" class="home-secondary" type="button"><span aria-hidden="true"></span>排行榜</button>
            <button id="home-settings" class="home-secondary" type="button"><span aria-hidden="true"></span>设置</button>
          </div>
        </div>
      </div>
      <!-- Controls card (v0.4.1, 03 §13): the PC keyboard legend, drawn rather than
           written. Each row is a keycap pair, a mini cube with the ring of the world
           axis that key turns, and a two-word caption. The mini cube is a real CSS
           3D cube and it TURNS when the matching key is pressed, so the card teaches
           the mapping by doing it. Markup stays static (hand-tuned art); the headless
           check compares the printed keycaps against KEY_BINDINGS in
           src/rendering/keyboard.js, so the legend can never advertise a dead key. -->
      <div id="controls-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="controls-title">
        <div class="modal-content controls-card">
          <div class="settings-header">
            <div><div class="eyebrow">PC KEYBOARD</div><h1 id="controls-title">操作说明</h1></div>
            <button id="controls-close" class="modal-close" type="button" aria-label="Close controls">×</button>
          </div>
          <div class="controls-list">
            <div class="ctrl-row" data-axis="pitch">
              <div class="ctrl-keys"><kbd data-key="w">W</kbd><kbd data-key="s">S</kbd></div>
              <div class="ctrl-diagram" aria-hidden="true">
                <span class="ctrl-cube"><i class="ctrl-face ctrl-back"></i><i class="ctrl-face ctrl-left"></i><i class="ctrl-face ctrl-right"></i><i class="ctrl-face ctrl-top"></i></span>
                <span class="ctrl-ring"><i></i></span>
              </div>
              <div class="ctrl-copy"><strong>上下翻面</strong><small>绕 X 轴（屏幕横轴）</small></div>
            </div>
            <div class="ctrl-row" data-axis="yaw">
              <div class="ctrl-keys"><kbd data-key="a">A</kbd><kbd data-key="d">D</kbd></div>
              <div class="ctrl-diagram" aria-hidden="true">
                <span class="ctrl-cube"><i class="ctrl-face ctrl-back"></i><i class="ctrl-face ctrl-left"></i><i class="ctrl-face ctrl-right"></i><i class="ctrl-face ctrl-top"></i></span>
                <span class="ctrl-ring"><i></i></span>
              </div>
              <div class="ctrl-copy"><strong>左右翻转</strong><small>绕 Y 轴（屏幕纵轴）</small></div>
            </div>
            <div class="ctrl-row" data-axis="roll">
              <div class="ctrl-keys"><kbd data-key="q">Q</kbd><kbd data-key="e">E</kbd></div>
              <div class="ctrl-diagram" aria-hidden="true">
                <span class="ctrl-cube"><i class="ctrl-face ctrl-back"></i><i class="ctrl-face ctrl-left"></i><i class="ctrl-face ctrl-right"></i><i class="ctrl-face ctrl-top"></i></span>
                <span class="ctrl-ring"><i></i></span>
              </div>
              <div class="ctrl-copy"><strong>平面自转</strong><small>绕 Z 轴（屏幕法线）</small></div>
            </div>
          </div>
          <p class="controls-note">每个键 = 一次翻面，与鼠标拖拽 / 单指滑动完全同轴同向；按住不连发。</p>
        </div>
      </div>
      <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content settings-card">
          <div class="settings-header">
            <div><h1 id="settings-title">设置</h1></div>
            <button id="settings-close" class="modal-close" type="button" aria-label="Close settings">×</button>
          </div>
          <div class="settings-list">
            <button id="sound-setting" class="setting-row" type="button"><span><strong>声音</strong><small>放置与消除音效</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <button id="haptics-setting" class="setting-row" type="button"><span><strong>触感</strong><small>触摸震动反馈</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <!-- v0.9.12: the drag-turn switch (03 §3.1). ON = carrying a piece until its own
                 centre leaves the cube's outline turns the cube; OFF = that gesture only ever
                 moves the piece, and faces are turned with the keyboard or by dragging the
                 background. -->
            <button id="drag-turn-setting" class="setting-row" type="button"><span><strong>拖块翻面</strong><small>方块带出六面体即翻面</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <button id="controls-setting" class="setting-row" type="button"><span><strong>操作说明</strong><small>键盘与旋转操作</small></span><span class="setting-hint" aria-hidden="true">W A S D Q E</span></button>
            <!-- v0.4: the way home from anywhere, including the Game Over panel. The
                 run in progress is snapshotted first, so this never costs progress. -->
            <button id="home-setting" class="setting-action" type="button"><span aria-hidden="true">⌂</span><strong>回到主页</strong></button>
            <button id="restart-setting" class="setting-action danger" type="button"><span>↻</span><strong>重新开始</strong></button>
          </div>
        </div>
      </div>
      <!-- Game Over (08 §7.5): the "再来一局" screen. Delta copy first, then the next
           goal (六面制霸), then what was earned this run. -->
      <div id="game-over" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
        <div class="modal-content game-over-card">
          <div class="eyebrow">本局完成</div>
          <h1 id="game-over-title">再挑战一次</h1>
          <div class="final-score"><span id="final-score">0000</span><small>本局得分</small></div>
          <p id="game-over-best" class="game-over-best"></p>
          <div id="game-over-faces" class="game-over-faces"></div>
          <div id="game-over-honors" class="game-over-honors"></div>
          <div id="game-over-stats" class="game-over-stats"></div>
          <div class="game-over-actions">
            <button id="reset-modal" class="restart-button" type="button"><span>↻</span> 再来一局</button>
            <button id="leaderboard-button" class="ghost-button" type="button">排行榜</button>
          </div>
        </div>
      </div>
      <!-- Local leaderboard panel (08 §7.5): Layer 1 only, plus the platform entry.
           Rows are rendered in main.js from src/game/records.js. -->
      <div id="leaderboard" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title">
        <div class="modal-content leaderboard-card">
          <div class="settings-header">
            <div><div class="eyebrow">LOCAL RECORDS</div><h1 id="leaderboard-title">排行榜</h1></div>
            <button id="leaderboard-close" class="modal-close" type="button" aria-label="Close leaderboard">×</button>
          </div>
          <div id="leaderboard-body" class="leaderboard-body"></div>
          <div id="leaderboard-platform" class="leaderboard-platform"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
