<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#69a5ff" />
    <title>VoxalBlast</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">V</span><span>VoxalBlast</span><span id="app-version" class="app-version" aria-label="Game version"></span></div>
        <div class="top-actions">
          <button id="settings-button" class="icon-button" type="button" aria-label="Open settings" title="Settings"><span aria-hidden="true">⚙</span></button>
        </div>
      </header>
      <main class="game-layout">
        <aside class="score-panel">
          <div class="eyebrow">SCORE</div>
          <div id="score" class="score-value">0000</div>
          <div class="best-label">BEST <span id="best">0000</span></div>
          <div class="status-line"><span class="status-dot"></span><span id="status">PLACE A SHAPE</span></div>
          <div class="help-copy">Build complete lines through the cube. Rotate pieces, then drag them onto the grid.</div>
        </aside>
        <section class="board-section">
          <div class="board-heading"><span>VOXEL GRID</span><span id="lines-readout">0 LINES</span></div>
          <div id="scene-wrap" class="scene-wrap"></div>
          <div id="toast" class="toast" aria-live="polite"></div>
        </section>
        <aside class="pieces-panel">
          <div class="panel-heading">PIECES</div>
          <div id="piece-slots" class="piece-slots"></div>
        </aside>
      </main>
      <footer class="mobile-controls">
        <button class="rotate-button" data-axis="x" type="button">↻ X</button>
        <button class="rotate-button" data-axis="y" type="button">↻ Y</button>
        <button class="rotate-button" data-axis="z" type="button">↻ Z</button>
        <button id="reset-mobile" class="rotate-button" type="button" aria-label="Reset camera view">⌖ VIEW RESET</button>
      </footer>
      <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="modal-content settings-card">
          <div class="settings-header">
            <div><div class="eyebrow">GAME OPTIONS</div><h1 id="settings-title">SETTINGS</h1></div>
            <button id="settings-close" class="modal-close" type="button" aria-label="Close settings">×</button>
          </div>
          <div class="settings-list">
            <button id="sound-setting" class="setting-row" type="button"><span><strong>SOUND</strong><small>Game audio</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <button id="haptics-setting" class="setting-row" type="button"><span><strong>HAPTICS</strong><small>Touch vibration</small></span><span class="setting-switch" aria-hidden="true"><i></i></span></button>
            <button id="view-setting" class="setting-action" type="button"><span>⌖</span><strong>RESET VIEW</strong></button>
            <button id="restart-setting" class="setting-action danger" type="button"><span>↻</span><strong>RESTART GAME</strong></button>
          </div>
        </div>
      </div>
      <div id="game-over" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
        <div class="modal-content">
          <div class="eyebrow">RUN COMPLETE</div>
          <h1 id="game-over-title">GAME OVER</h1>
          <div class="final-score"><span id="final-score">0000</span><small>POINTS</small></div>
          <div class="final-best">BEST <span id="final-best">0000</span></div>
          <button id="reset-modal" class="restart-button" type="button"><span>↻</span> PLAY AGAIN</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
